# XcodeGen spec. On a Mac:
#   brew install xcodegen
#   cd driveclaim && xcodegen generate && open Loopd.xcodeproj
# This creates the full project with files, packages, Info.plist and
# capabilities already wired, so you don't configure the target by hand.
name: Loopd
options:
  bundleIdPrefix: com.akilan
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

packages:
  TerritoryCore:
    path: Core
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0

targets:
  Loopd:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: TerritoryCore
        product: TerritoryCore
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.akilan.loopd
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    # Background location + audio so drives keep tracking with the screen off.
    entitlements:
      path: App/Loopd.entitlements
      properties: {}
